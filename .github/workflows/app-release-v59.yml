name: app-release-v59
on:
  push:
    paths:
      - ".github/workflows/app-release-v59.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SRC: https://eduspark-quality.sites.tab.bot/play
      SHA_APK: c8151f9ec1cb86d00d05f3f95480e3834c5aaf6c6e844db496bd046d419a830e
      SHA_AAB: 8752ef7c4ba59ec7862c169f8edca9acd211df5214b7d77351000a1b02a8c86d
    steps:
      - name: Fetch files
        run: |
          curl -fL --retry 5 -o Eduspark_v5.9.apk "$SRC/Eduspark_v5.9_r2.apk"
          curl -fL --retry 5 -o Eduspark_v5.9_play.aab "$SRC/Eduspark_v5.9_r2_play.aab"
          echo "$SHA_APK  Eduspark_v5.9.apk" | sha256sum -c -
          echo "$SHA_AAB  Eduspark_v5.9_play.aab" | sha256sum -c -
      - name: Create release
        run: |
          gh release create app-v5.9 Eduspark_v5.9.apk Eduspark_v5.9_play.aab --title "Eduspark app v5.9" --notes "Eduspark 5.9: App update section in Profile (check and update anytime), update check on every app open, downloads wait for the latest version (reading online always works, switch in the admin panel), lectures inside batches (Batch > Subject > Lectures)." --target main --latest=false
      - name: Verify download
        run: |
          sleep 10
          curl -fL --retry 5 -o check.apk "https://github.com/${GH_REPO}/releases/download/app-v5.9/Eduspark_v5.9.apk"
          curl -fL --retry 5 -o check.aab "https://github.com/${GH_REPO}/releases/download/app-v5.9/Eduspark_v5.9_play.aab"
          echo "$SHA_APK  check.apk" | sha256sum -c -
          echo "$SHA_AAB  check.aab" | sha256sum -c -
