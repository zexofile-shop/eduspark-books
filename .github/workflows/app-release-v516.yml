name: app-release-v516
on:
  push:
    paths:
      - ".github/workflows/app-release-v516.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SRC: https://eduspark-quality.sites.tab.bot/play
      SHA_APK: 50ed7f161a9317e6c07629be28eecb41e5616fb152178901b5460e37727707f2
      SHA_AAB: 8ddf485ba083946f0445d98557e0b7323c1233170e84ce04430c0e78d4b6d3c9
    steps:
      - name: Fetch files
        run: |
          curl -fL --retry 5 -o Eduspark_v5.16.apk "$SRC/Eduspark_v5.16_rel.apk"
          curl -fL --retry 5 -o Eduspark_v5.16_play.aab "$SRC/Eduspark_v5.16_rel_play.aab"
          echo "$SHA_APK  Eduspark_v5.16.apk" | sha256sum -c -
          echo "$SHA_AAB  Eduspark_v5.16_play.aab" | sha256sum -c -
      - name: Create release
        run: |
          gh release create app-v5.16 Eduspark_v5.16.apk Eduspark_v5.16_play.aab --title "Eduspark app v5.16" --notes "Eduspark 5.16: Batches/Lectures switched off in the panel are fully off for students everywhere (batch page, links, notifications, Continue watching, search) with a 'paused right now' screen; panel can switch off normal tests or one batch's tests; owner/admins keep access with a 'Hidden for students' strip and a View as student switch; long-press to remove items from Continue reading/watching (Undo, Clear all, synced across devices); new full-width batch cards; Community now inside the batch page; Eduspark on YouTube in Profile." --target main --latest=false
      - name: Verify download
        run: |
          sleep 10
          curl -fL --retry 5 -o check.apk "https://github.com/${GH_REPO}/releases/download/app-v5.16/Eduspark_v5.16.apk"
          curl -fL --retry 5 -o check.aab "https://github.com/${GH_REPO}/releases/download/app-v5.16/Eduspark_v5.16_play.aab"
          echo "$SHA_APK  check.apk" | sha256sum -c -
          echo "$SHA_AAB  check.aab" | sha256sum -c -
