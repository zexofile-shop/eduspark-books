name: app-release-v511
on:
  push:
    paths:
      - ".github/workflows/app-release-v511.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SRC: https://eduspark-quality.sites.tab.bot/play
      SHA_APK: cfee44efd9eee66b2286df926a1254ac7f446fcd4129cfca54551a650b1400e6
      SHA_AAB: 5f55cd1dbfbc201989c3196a5796919ea5ab5d263a8e7bbe1fb4e4e001753bc6
    steps:
      - name: Fetch files
        run: |
          curl -fL --retry 5 -o Eduspark_v5.11.apk "$SRC/Eduspark_v5.11_rel.apk"
          curl -fL --retry 5 -o Eduspark_v5.11_play.aab "$SRC/Eduspark_v5.11_rel_play.aab"
          echo "$SHA_APK  Eduspark_v5.11.apk" | sha256sum -c -
          echo "$SHA_AAB  Eduspark_v5.11_play.aab" | sha256sum -c -
      - name: Create release
        run: |
          gh release create app-v5.11 Eduspark_v5.11.apk Eduspark_v5.11_play.aab --title "Eduspark app v5.11" --notes "Eduspark 5.11: leaderboard always shows your latest XP (live, pull to refresh) with a top-3 podium; +XP animation when you earn XP; XP for time in the app; new streak icon; About & policies (privacy, terms, data safety, account deletion, FAQ); delete account also removes your XP and test results. Includes everything from 5.10." --target main --latest=false
      - name: Verify download
        run: |
          sleep 10
          curl -fL --retry 5 -o check.apk "https://github.com/${GH_REPO}/releases/download/app-v5.11/Eduspark_v5.11.apk"
          curl -fL --retry 5 -o check.aab "https://github.com/${GH_REPO}/releases/download/app-v5.11/Eduspark_v5.11_play.aab"
          echo "$SHA_APK  check.apk" | sha256sum -c -
          echo "$SHA_AAB  check.aab" | sha256sum -c -
