name: app-release-v57
on:
  push:
    paths:
      - ".github/workflows/app-release-v57.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SRC: https://eduspark-quality.sites.tab.bot/play/Eduspark_v5.7.apk
      SHA: 8f21920856a7917481f1089f07ef9164b38904a0a0ec7b69dcd213ed6c77c40f
    steps:
      - name: Fetch APK
        run: |
          curl -fL --retry 5 -o Eduspark_v5.7.apk "$SRC"
          ls -l Eduspark_v5.7.apk
          echo "$SHA  Eduspark_v5.7.apk" | sha256sum -c -
      - name: Create release and upload
        run: |
          if ! gh release view app-v5.7 >/dev/null 2>&1; then
            gh release create app-v5.7 --target main --title "Eduspark app v5.7" --notes "Eduspark Android app v5.7 (versionCode 13)."
          fi
          gh release upload app-v5.7 Eduspark_v5.7.apk --clobber
      - name: Verify download
        run: |
          sleep 5
          curl -fL --retry 5 -o check.apk "https://github.com/${GH_REPO}/releases/download/app-v5.7/Eduspark_v5.7.apk"
          echo "$SHA  check.apk" | sha256sum -c -
