name: app-reissue-v516c
on:
  push:
    paths:
      - ".github/workflows/app-reissue-v516c.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: app-v5.16
      SRC: https://eduspark-quality.sites.tab.bot/play
    steps:
      - name: Replace assets (upload new under temp name, verify, then swap)
        run: |
          set -euo pipefail
          swap() {
            name="$1"; staged="$2"; sha="$3"; tmp="new-$name"
            curl -fL --retry 5 -o "$tmp" "$SRC/$staged"
            echo "$sha  $tmp" | sha256sum -c -
            left=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$tmp\") | .id")
            if [ -n "$left" ]; then gh api -X DELETE "repos/$GH_REPO/releases/assets/$left"; fi
            gh release upload "$TAG" "$tmp"
            sleep 8
            curl -fL --retry 5 -o chk.bin "https://github.com/$GH_REPO/releases/download/$TAG/$tmp"
            echo "$sha  chk.bin" | sha256sum -c -
            new_id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$tmp\") | .id")
            old_id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | .id")
            echo "new=$new_id old=$old_id"
            if [ -n "$old_id" ]; then gh api -X DELETE "repos/$GH_REPO/releases/assets/$old_id"; fi
            gh api -X PATCH "repos/$GH_REPO/releases/assets/$new_id" -f name="$name" --jq .name
            sleep 8
            curl -fL --retry 5 -o fin.bin "https://github.com/$GH_REPO/releases/download/$TAG/$name"
            echo "$sha  fin.bin" | sha256sum -c -
            rm -f chk.bin fin.bin "$tmp"
          }
          swap Eduspark_v5.16.apk Eduspark_v5.16_r3.apk 16ce86cca0b0d16c9d5da5d7c3621fc2cb39ab421068e32bd24cc5f0a514ef20
          swap Eduspark_v5.16_play.aab Eduspark_v5.16_r3_play.aab 8883a77bedd1711a3f65fc0115b0253eef417afc13c9a0ea33812371ad96c921
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | "\(.name) \(.size)"'
          gh api "repos/$GH_REPO/releases/latest" --jq .tag_name
