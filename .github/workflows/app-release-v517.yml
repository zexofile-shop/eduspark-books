name: app-release-v517
on:
  push:
    paths:
      - ".github/workflows/app-release-v517.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SRC: https://eduspark-quality.sites.tab.bot/play
      SHA_APK: b031398a62513e971d1fb87481560dbe7d69dcf2d425018f644a352c52abdb11
      SHA_AAB: e9d59533cbd5b1ce5dc1905a8773b4f27c97a2135ac9fff0172b4f865fcc611b
    steps:
      - name: Fetch files
        run: |
          curl -fL --retry 5 -o Eduspark_v5.17.apk "$SRC/Eduspark_v5.17_rel.apk"
          curl -fL --retry 5 -o Eduspark_v5.17_play.aab "$SRC/Eduspark_v5.17_rel_play.aab"
          echo "$SHA_APK  Eduspark_v5.17.apk" | sha256sum -c -
          echo "$SHA_AAB  Eduspark_v5.17_play.aab" | sha256sum -c -
      - name: Create release
        run: |
          gh release create app-v5.17 Eduspark_v5.17.apk Eduspark_v5.17_play.aab --title "Eduspark app v5.17" --notes "Eduspark 5.17 (Play Store ready): new Privacy Policy, Terms, Community Guidelines, Child Safety, Account deletion, Data safety and Contact pages inside the app; legal links can be changed from the admin panel; Read the full Community Guidelines from the chat rules; deleting your account also removes your comments, likes and chat messages in every batch; Home banners without the circle (picture fades in). Play build: Eduspark_v5.17_play.aab. APK for direct install: Eduspark_v5.17.apk." --target main --latest=false
      - name: Verify download
        run: |
          sleep 10
          curl -fL --retry 5 -o check.apk "https://github.com/${GH_REPO}/releases/download/app-v5.17/Eduspark_v5.17.apk"
          curl -fL --retry 5 -o check.aab "https://github.com/${GH_REPO}/releases/download/app-v5.17/Eduspark_v5.17_play.aab"
          echo "$SHA_APK  check.apk" | sha256sum -c -
          echo "$SHA_AAB  check.aab" | sha256sum -c -
