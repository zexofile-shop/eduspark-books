name: upload-selftest
on:
  push:
    paths: ['.github/workflows/upload-selftest.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      IMPORT_URL: https://eduspark-quality.sites.tab.bot/play/Real-Numbers-Class10-Maths-Ch1-360p.mp4
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Prepare
        run: |
          git clone -q --depth 1 https://github.com/zexofile-shop/media-relay mr
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -t 5 -c:v libx264 -preset veryfast -pix_fmt yuv420p test.mp4
          echo  | base64 -d > gen.js && node gen.js
          ls -l
