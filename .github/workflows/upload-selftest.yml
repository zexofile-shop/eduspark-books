name: upload-selftest
on:
  push:
    paths: ['.github/workflows/upload-selftest.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove the test releases
        run: |
          for t in upload-selftest upload-selftest-parts; do gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true; done
          gh release list -R "$GITHUB_REPOSITORY"
