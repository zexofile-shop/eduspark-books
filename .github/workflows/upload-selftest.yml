name: upload-selftest
on:
  push:
    paths: ['.github/workflows/upload-selftest.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Prepare
        run: |
          git clone -q --depth 1 https://github.com/zexofile-shop/media-relay mr
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 40 -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p -c:a aac -shortest test.mp4
          echo  | base64 -d > gen.js && node gen.js
          ls -l test.mp4 big.pdf small.pdf
