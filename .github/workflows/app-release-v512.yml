name: app-release-v512
on:
  push:
    paths:
      - ".github/workflows/app-release-v512.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SRC: https://eduspark-quality.sites.tab.bot/play
      SHA_APK: 8a8aa731011acd221f43365fb9921c96104a3c22f3e21c39a2280ca51cb6da75
      SHA_AAB: 5fea6244a0de4680294f1021e5fde69be540dd72265e105fc1c38114ca204461
    steps:
      - name: Fetch files
        run: |
          curl -fL --retry 5 -o Eduspark_v5.12.apk "$SRC/Eduspark_v5.12_rel.apk"
          curl -fL --retry 5 -o Eduspark_v5.12_play.aab "$SRC/Eduspark_v5.12_rel_play.aab"
          echo "$SHA_APK  Eduspark_v5.12.apk" | sha256sum -c -
          echo "$SHA_AAB  Eduspark_v5.12_play.aab" | sha256sum -c -
      - name: Create release
        run: |
          gh release create app-v5.12 Eduspark_v5.12.apk Eduspark_v5.12_play.aab --title "Eduspark app v5.12" --notes "Eduspark 5.12: lecture and reading XP now 'every N minutes -> M XP' (set from the admin panel, like app time). Includes everything from 5.11: live leaderboard with top-3 podium, +XP animation, app-time XP, streak icon, About & policies, full account deletion." --target main --latest=false
      - name: Verify download
        run: |
          sleep 10
          curl -fL --retry 5 -o check.apk "https://github.com/${GH_REPO}/releases/download/app-v5.12/Eduspark_v5.12.apk"
          curl -fL --retry 5 -o check.aab "https://github.com/${GH_REPO}/releases/download/app-v5.12/Eduspark_v5.12_play.aab"
          echo "$SHA_APK  check.apk" | sha256sum -c -
          echo "$SHA_AAB  check.aab" | sha256sum -c -
