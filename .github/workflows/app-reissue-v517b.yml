name: app-reissue-v517b
on:
  push:
    paths:
      - ".github/workflows/app-reissue-v517b.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: app-v5.17
      SRC: https://eduspark-quality.sites.tab.bot/play
    steps:
      - name: Fetch new files and check sha256
        run: |
          mkdir new && cd new
          curl -fL --retry 5 -o "Eduspark_v5.17.apk" "$SRC/Eduspark_v5.17c_rel.apk"
          curl -fL --retry 5 -o "Eduspark_v5.17_play.aab" "$SRC/Eduspark_v5.17c_rel_play.aab"
          curl -fL --retry 5 -o "Eduspark_v5.17_PlayStore.zip" "$SRC/Eduspark_v5.17c_PlayStore.zip"
          curl -fL --retry 5 -o "Eduspark_legal_pages.zip" "$SRC/Eduspark_v5.17c_legal_pages.zip"
          echo "1930bcd837bae5788a0ac2f07eedb4ee790954adb62337fae7182d50a7bd0dd4  Eduspark_v5.17.apk" >> ../sums.txt
          echo "031df5cef165122dc0c5300d8c958a374a83d0fad7cb2c79d04ec3f6ee806677  Eduspark_v5.17_play.aab" >> ../sums.txt
          echo "3eedc5ea7283d4d758d46bcce051161bcc4324b08ec9aea22bdc7f285e7d1cab  Eduspark_v5.17_PlayStore.zip" >> ../sums.txt
          echo "ae31c88c0b2c285f20944ca76c2c800635f9ca939abc5084546501857b1f31ad  Eduspark_legal_pages.zip" >> ../sums.txt
          sha256sum -c ../sums.txt
        shell: bash
      - name: Upload under temporary names
        run: |
          cd new
          for f in *; do cp "$f" "tmp_$f"; done
          gh release upload "$TAG" tmp_* --clobber
      - name: Download temporary assets back and verify
        run: |
          mkdir chk && cd chk
          sleep 10
          while read -r sum name; do
            curl -fL --retry 5 -o "$name" "https://github.com/${GH_REPO}/releases/download/${TAG}/tmp_${name}"
            echo "$sum  $name" | sha256sum -c -
          done < ../sums.txt
      - name: Swap (delete old, rename temporary)
        run: |
          while read -r sum name; do
            OLD=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name==\"${name}\") | .id")
            NEW=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name==\"tmp_${name}\") | .id")
            test -n "$NEW"
            if [ -n "$OLD" ]; then gh api -X DELETE "repos/${GH_REPO}/releases/assets/${OLD}"; fi
            gh api -X PATCH "repos/${GH_REPO}/releases/assets/${NEW}" -f name="${name}" --jq .name
          done < sums.txt
      - name: Verify final URLs
        run: |
          mkdir fin && cd fin
          sleep 10
          while read -r sum name; do
            curl -fL --retry 5 -o "$name" "https://github.com/${GH_REPO}/releases/download/${TAG}/${name}"
            echo "$sum  $name" | sha256sum -c -
          done < ../sums.txt
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.assets[] | .name + " " + (.size|tostring)'
