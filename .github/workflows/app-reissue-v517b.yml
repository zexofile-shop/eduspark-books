name: app-reissue-v517b
on:
  push:
    paths:
      - ".github/workflows/app-reissue-v517b.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: app-v5.17
      SRC: https://eduspark-quality.sites.tab.bot/play
    steps:
      - name: Fetch new files and check sha256
        run: |
          mkdir new && cd new
          curl -fL --retry 5 -o "Eduspark_v5.17.apk" "$SRC/Eduspark_v5.17d_rel.apk"
          curl -fL --retry 5 -o "Eduspark_v5.17_play.aab" "$SRC/Eduspark_v5.17d_rel_play.aab"
          curl -fL --retry 5 -o "Eduspark_v5.17_PlayStore.zip" "$SRC/Eduspark_v5.17d_PlayStore.zip"
          curl -fL --retry 5 -o "Eduspark_legal_pages.zip" "$SRC/Eduspark_v5.17d_legal_pages.zip"
          echo "064d24775ac3086776debcd887dc4c33f03f5e93247419dc56a0eb0d675da5b2  Eduspark_v5.17.apk" >> ../sums.txt
          echo "e388ed44dcd0f067bdf8855aa17abffe0c62fe7a609cbb7189af0f80a1b38e42  Eduspark_v5.17_play.aab" >> ../sums.txt
          echo "1ec703b75305819017f4e696a3ea4049dfbe6a6d5e7fe4c6d5214de2ec709105  Eduspark_v5.17_PlayStore.zip" >> ../sums.txt
          echo "db62748e457d9db90be3579eb873d76c15247576211e7cd75c5efcef6d152082  Eduspark_legal_pages.zip" >> ../sums.txt
          sha256sum -c ../sums.txt
        shell: bash
      - name: Upload under temporary names
        run: |
          cd new
          for f in *; do cp "$f" "tmp_$f"; done
          gh release upload "$TAG" tmp_* --clobber
      - name: Download temporary assets back and verify
        run: |
          mkdir chk && cd chk
          sleep 10
          while read -r sum name; do
            curl -fL --retry 5 -o "$name" "https://github.com/${GH_REPO}/releases/download/${TAG}/tmp_${name}"
            echo "$sum  $name" | sha256sum -c -
          done < ../sums.txt
      - name: Swap (delete old, rename temporary)
        run: |
          while read -r sum name; do
            OLD=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name==\"${name}\") | .id")
            NEW=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name==\"tmp_${name}\") | .id")
            test -n "$NEW"
            if [ -n "$OLD" ]; then gh api -X DELETE "repos/${GH_REPO}/releases/assets/${OLD}"; fi
            gh api -X PATCH "repos/${GH_REPO}/releases/assets/${NEW}" -f name="${name}" --jq .name
          done < sums.txt
      - name: Verify final URLs
        run: |
          mkdir fin && cd fin
          sleep 10
          while read -r sum name; do
            curl -fL --retry 5 -o "$name" "https://github.com/${GH_REPO}/releases/download/${TAG}/${name}"
            echo "$sum  $name" | sha256sum -c -
          done < ../sums.txt
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.assets[] | .name + " " + (.size|tostring)'
