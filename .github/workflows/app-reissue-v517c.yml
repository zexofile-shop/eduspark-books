name: app-reissue-v517c
on:
  push:
    paths:
      - ".github/workflows/app-reissue-v517c.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: app-v5.17
      SRC: https://eduspark-quality.sites.tab.bot/play
    steps:
      - name: Fetch new files and check sha256
        run: |
          mkdir new && cd new
          curl -fL --retry 5 -o "Eduspark_v5.17.apk" "$SRC/Eduspark_v5.17e_rel.apk"
          curl -fL --retry 5 -o "Eduspark_v5.17_play.aab" "$SRC/Eduspark_v5.17e_rel_play.aab"
          curl -fL --retry 5 -o "Eduspark_v5.17_PlayStore.zip" "$SRC/Eduspark_v5.17e_PlayStore.zip"
          curl -fL --retry 5 -o "Eduspark_legal_pages.zip" "$SRC/Eduspark_v5.17e_legal_pages.zip"
          echo "c753a993de186e173bb4f14f87b588848c3d8bbe0fb0980fbc13013457edf251  Eduspark_v5.17.apk" >> ../sums.txt
          echo "bcf336ad0a5a8668364ab70edd019f783af4fa77f6b8ab7a6d2baaafb14a6e73  Eduspark_v5.17_play.aab" >> ../sums.txt
          echo "dd96b70c1232d5fb06ebc887d041c6451d9f45af4a0546d81b0e4e71e655a3cc  Eduspark_v5.17_PlayStore.zip" >> ../sums.txt
          echo "e5f00317ab09d30a3d5c50de76038d358a32572840ba7dd9f99ed972796d9f84  Eduspark_legal_pages.zip" >> ../sums.txt
          sha256sum -c ../sums.txt
        shell: bash
      - name: Upload under temporary names
        run: |
          cd new
          for f in *; do cp "$f" "tmp_$f"; done
          gh release upload "$TAG" tmp_* --clobber
      - name: Download temporary assets back and verify
        run: |
          mkdir chk && cd chk
          sleep 10
          while read -r sum name; do
            curl -fL --retry 5 -o "$name" "https://github.com/${GH_REPO}/releases/download/${TAG}/tmp_${name}"
            echo "$sum  $name" | sha256sum -c -
          done < ../sums.txt
      - name: Swap (delete old, rename temporary)
        run: |
          while read -r sum name; do
            OLD=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name==\"${name}\") | .id")
            NEW=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name==\"tmp_${name}\") | .id")
            test -n "$NEW"
            if [ -n "$OLD" ]; then gh api -X DELETE "repos/${GH_REPO}/releases/assets/${OLD}"; fi
            gh api -X PATCH "repos/${GH_REPO}/releases/assets/${NEW}" -f name="${name}" --jq .name
          done < sums.txt
      - name: Verify final URLs
        run: |
          mkdir fin && cd fin
          sleep 10
          while read -r sum name; do
            curl -fL --retry 5 -o "$name" "https://github.com/${GH_REPO}/releases/download/${TAG}/${name}"
            echo "$sum  $name" | sha256sum -c -
          done < ../sums.txt
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.assets[] | .name + " " + (.size|tostring)'
