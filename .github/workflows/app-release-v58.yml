name: app-release-v58
on:
  push:
    paths:
      - ".github/workflows/app-release-v58.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SRC: https://eduspark-quality.sites.tab.bot/play
      SHA_APK: 2006225983c9904c7aa02609d27d3cfab1869940f708aa41e918bc9ddd35a17a
      SHA_AAB: 40238ee94343cbc889e198eb61593a619bde3583616ac9b37cee134b445ee6b7
    steps:
      - name: Fetch files
        run: |
          curl -fL --retry 5 -o Eduspark_v5.8.apk "$SRC/Eduspark_v5.8.apk"
          curl -fL --retry 5 -o Eduspark_v5.8_play.aab "$SRC/Eduspark_v5.8_play.aab"
          echo "$SHA_APK  Eduspark_v5.8.apk" | sha256sum -c -
          echo "$SHA_AAB  Eduspark_v5.8_play.aab" | sha256sum -c -
      - name: Create release and upload
        run: |
          if ! gh release view app-v5.8 >/dev/null 2>&1; then
            gh release create app-v5.8 --target main --title "Eduspark app v5.8" --notes "$(printf 'Eduspark Android app v5.8 (versionCode 14).\n\n- Maintenance mode and messages from the admin panel\n- Books, batches, tests and notices come live from the admin panel\n- Notices and sent notifications in the inbox\n- Test results and leaderboards\n- Saved content when offline')"
          fi
          gh release upload app-v5.8 Eduspark_v5.8.apk Eduspark_v5.8_play.aab --clobber
      - name: Verify download
        run: |
          sleep 5
          curl -fL --retry 5 -o check.apk "https://github.com/${GH_REPO}/releases/download/app-v5.8/Eduspark_v5.8.apk"
          echo "$SHA_APK  check.apk" | sha256sum -c -
