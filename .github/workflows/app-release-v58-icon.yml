name: app-release-v58-icon
on:
  push:
    paths:
      - ".github/workflows/app-release-v58-icon.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SRC: https://eduspark-quality.sites.tab.bot/play
      SHA_APK: 0210f35533b8bf7fb5648d6d5b894c2321e152d0830afc844ad7362c62c3c8c3
      SHA_AAB: 414a2690cd86b63aa53db6def6a1808cb505a28aaf3356cbe095ba9d55f24d3c
    steps:
      - name: Fetch files
        run: |
          curl -fL --retry 5 -o Eduspark_v5.8.apk "$SRC/Eduspark_v5.8_gc.apk"
          curl -fL --retry 5 -o Eduspark_v5.8_play.aab "$SRC/Eduspark_v5.8_gc_play.aab"
          echo "$SHA_APK  Eduspark_v5.8.apk" | sha256sum -c -
          echo "$SHA_AAB  Eduspark_v5.8_play.aab" | sha256sum -c -
      - name: Replace release assets
        run: |
          gh release upload app-v5.8 Eduspark_v5.8.apk Eduspark_v5.8_play.aab --clobber
      - name: Verify download
        run: |
          sleep 10
          curl -fL --retry 5 -o check.apk "https://github.com/${GH_REPO}/releases/download/app-v5.8/Eduspark_v5.8.apk"
          curl -fL --retry 5 -o check.aab "https://github.com/${GH_REPO}/releases/download/app-v5.8/Eduspark_v5.8_play.aab"
          echo "$SHA_APK  check.apk" | sha256sum -c -
          echo "$SHA_AAB  check.aab" | sha256sum -c -
