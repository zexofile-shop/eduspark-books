name: import-books
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download original PDFs (byte-identical, no changes)
        run: |
          mkdir -p books
          cut -d' ' -f3 books.sha256 | sed 's#^books/##' | while read -r n; do
            curl -fsSL --retry 5 --retry-delay 3 -o "books/$n" "https://eduspark-books.sites.tab.bot/books/$n"
            ls -l "books/$n"
          done
      - name: Verify sha256 of every file
        run: sha256sum -c books.sha256
      - name: Commit PDFs to the repo
        run: |
          git config user.name "Eduspark Books Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books
          git commit -m "Add Eduspark book PDFs (original, uncompressed)" || echo "nothing to commit"
          git push
      - name: Create release books-v1 with all PDFs as assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create books-v1 books/*.pdf --title "Eduspark Books v1" --notes "Free CBSE e-books by Eduspark. Original PDFs, not compressed. sha256 list in books.sha256."
